<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/products">
        <span class="brand-mark">SG</span>
        <span class="brand-name">StockGuard</span>
      </a>

      @if (auth.isLoggedIn()) {
        <nav class="nav-links">
          <a routerLink="/products" routerLinkActive="active">Products</a>
          <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
          <a routerLink="/purchase-orders" routerLinkActive="active">Purchase Orders</a>
          <a routerLink="/reserve" routerLinkActive="active">Reserve</a>
          <a routerLink="/alerts" routerLinkActive="active">Alerts</a>

          <div class="nav-dropdown">
            <button
              type="button"
              class="nav-dropdown-toggle"
              [class.active]="manageMenuOpen()"
              (click)="toggleManageMenu()"
            >
              Manage <span class="caret">▾</span>
            </button>
            @if (manageMenuOpen()) {
              <div class="nav-dropdown-backdrop" (click)="closeManageMenu()"></div>
              <div class="nav-dropdown-menu">
                <a routerLink="/categories" routerLinkActive="active" (click)="closeManageMenu()">Categories</a>
                <a routerLink="/suppliers" routerLinkActive="active" (click)="closeManageMenu()">Suppliers</a>
                <a routerLink="/warehouses" routerLinkActive="active" (click)="closeManageMenu()">Warehouses</a>
                @if (auth.hasRole('Administrator')) {
                  <a routerLink="/users" routerLinkActive="active" (click)="closeManageMenu()">Users</a>
                }
              </div>
            }
          </div>
        </nav>

        <div class="user-chip">
          <div class="avatar">{{ initials() }}</div>
          <div class="user-meta">
            <span class="user-name">{{ auth.currentUser()?.fullName }}</span>
            <span class="user-role">{{ auth.currentUser()?.role }}</span>
          </div>
          <button class="btn btn-ghost" type="button" (click)="logout()">Log out</button>
        </div>
      } @else {
        <a class="btn btn-secondary" routerLink="/login">Log in</a>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
